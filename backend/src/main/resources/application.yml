server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: days-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/rizi1?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 Flyway 管理；MySQL 5.7 与 Hibernate 对 timestamp/datetime 的类型名判定不一致，
      # 这里不再做启动期结构校验，避免误拦启动。
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # 使用独立的历史表名，避免被其他项目/测试写入的历史记录干扰校验
    table: rizi1_flyway_history
    baseline-on-migrate: true
    # 基线版本设为 0，保证 V1/V2/V3 在“库非空”时仍然全部执行，不会被当成已应用而跳过
    baseline-version: 0
    # 云托管滚动发布时可能有多个容器同时启动，放宽锁等待与连接重试
    lock-retry-count: 120
    connect-retries: 10
    connect-retries-interval: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  wechat:
    app-id: ${WECHAT_APP_ID:wxf63db4d43a9d71ca}
    app-secret: ${WECHAT_APP_SECRET:}
    session-url: ${WECHAT_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
    access-token-url: ${WECHAT_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
    # 注意：发送地址结尾必须是 /send，写成 /cgi-bin/message/subscribe 会 404。
    subscribe-message-url: ${WECHAT_SUBSCRIBE_MESSAGE_URL:https://api.weixin.qq.com/cgi-bin/message/subscribe/send}
    subscribe-template-id: ${WECHAT_SUBSCRIBE_TEMPLATE_ID:}
    access-token: ${WECHAT_ACCESS_TOKEN:}
    # 模板字段名必须与公众平台模板里的 {{xxx.DATA}} 完全一致，否则微信返回 47003 参数不合法。
    # 当前模板「记念日提醒」(编号 24904)：thing1=名称 / time2=日期 / number5=剩余天数
    template-name-field: ${WECHAT_TEMPLATE_NAME_FIELD:thing1}
    template-date-field: ${WECHAT_TEMPLATE_DATE_FIELD:time2}
    template-days-field: ${WECHAT_TEMPLATE_DAYS_FIELD:number5}
  reminder:
    cron: ${REMINDER_CRON:0 0 2 * * *}
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  cors-allowed-origins:
    - ${CORS_ORIGIN:http://localhost:3000}
