server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: db-smoke-test
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/rizi1?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 1
      connection-timeout: 5000
      initialization-fail-timeout: 5000
